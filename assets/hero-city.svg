<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="heroCityTitle">
  <title id="heroCityTitle">Пеший курьер идёт по улице Москвы мимо силуэтов зданий</title>
  <style>
    .scenery { animation: heroScroll 14s linear infinite; }
    @keyframes heroScroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-640px); }
    }
    .ground-line {
      stroke-dasharray: 14 12;
      animation: heroDash 0.57s linear infinite;
    }
    @keyframes heroDash {
      to { stroke-dashoffset: -26; }
    }
    .courier {
      animation: heroBob 0.6s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: 50% 100%;
    }
    @keyframes heroBob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-3px) rotate(-1.5deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .scenery, .ground-line, .courier { animation: none !important; }
    }
  </style>

  <rect width="640" height="480" fill="#1A1A1A"/>

  <g class="scenery">
    <g opacity="0.55">
      <rect x="0" y="230" width="90" height="250" fill="#262626"/>
      <rect x="95" y="180" width="70" height="300" fill="#2E2E2E"/>
      <rect x="170" y="260" width="60" height="220" fill="#242424"/>
      <rect x="470" y="200" width="80" height="280" fill="#2E2E2E"/>
      <rect x="555" y="250" width="85" height="230" fill="#242424"/>
      <rect x="380" y="150" width="60" height="330" fill="#333333"/>
    </g>
    <g opacity="0.9">
      <rect x="10" y="250" width="14" height="18" fill="#4FA184"/>
      <rect x="40" y="290" width="14" height="18" fill="#4FA184"/>
      <rect x="110" y="210" width="14" height="18" fill="#4FA184"/>
      <rect x="500" y="230" width="14" height="18" fill="#4FA184"/>
      <rect x="580" y="280" width="14" height="18" fill="#4FA184"/>
    </g>
    <g opacity="0.55" transform="translate(640,0)">
      <rect x="0" y="230" width="90" height="250" fill="#262626"/>
      <rect x="95" y="180" width="70" height="300" fill="#2E2E2E"/>
      <rect x="170" y="260" width="60" height="220" fill="#242424"/>
      <rect x="470" y="200" width="80" height="280" fill="#2E2E2E"/>
      <rect x="555" y="250" width="85" height="230" fill="#242424"/>
      <rect x="380" y="150" width="60" height="330" fill="#333333"/>
    </g>
    <g opacity="0.9" transform="translate(640,0)">
      <rect x="10" y="250" width="14" height="18" fill="#4FA184"/>
      <rect x="40" y="290" width="14" height="18" fill="#4FA184"/>
      <rect x="110" y="210" width="14" height="18" fill="#4FA184"/>
      <rect x="500" y="230" width="14" height="18" fill="#4FA184"/>
      <rect x="580" y="280" width="14" height="18" fill="#4FA184"/>
    </g>
  </g>

  <line class="ground-line" x1="0" y1="440" x2="640" y2="440" stroke="#0F6B4C" stroke-width="3" opacity="0.8"/>

